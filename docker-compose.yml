services:
  backend:                    # FastAPI: http://localhost:8000 (API docs at /docs)
    build: ./backend
    image: rideops-backend:0.2
    environment:
      CORS_ORIGINS: "http://localhost:3000"
    ports:
      - "8000:8000"
    volumes:
      - triage-state:/srv/data/state      # keeps agent feedback and your dataset choices between restarts
      - ./backend/data/uploads:/srv/data/uploads   # uploaded CSVs: you can see, add and delete them in this folder
    restart: unless-stopped

  frontend:                   # Next.js: http://localhost:3000
    build:
      context: ./frontend
      args:
        BACKEND_URL: "http://backend:8000"
    image: rideops-frontend:0.2
    environment:
      BACKEND_URL: "http://backend:8000"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  triage-state:
