<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RideOps Triage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Main navigation">
    <div class="brand">
      <span class="logo"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.5"/></svg></span>
      <span class="brand-name">RideOps Triage</span>
    </div>
    <nav class="nav">
      <p class="nav-h">Work</p>
      <a href="#queue" data-route="queue"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Open queue</span><b id="navCount" class="badge"></b></a>
      <a href="#try" data-route="try"><svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 17v4M17 19h4"/></svg><span>Try a ticket</span></a>
      <p class="nav-h">Diagnose</p>
      <a href="#overview" data-route="overview"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span>Overview</span></a>
      <a href="#backlog" data-route="backlog"><svg viewBox="0 0 24 24"><path d="M3 20h18M6 16V9M11 16V5M16 16v-5M21 16V8"/></svg><span>Backlog</span></a>
      <a href="#escalations" data-route="escalations"><svg viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"/></svg><span>Escalations</span></a>
      <a href="#agents" data-route="agents"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 5.2a3.2 3.2 0 0 1 0 5.6M18 14.4c1.8.8 3 2.6 3 5.6"/></svg><span>Agents</span></a>
      <a href="#clients" data-route="clients"><svg viewBox="0 0 24 24"><path d="M4 20V8l8-4 8 4v12M9 20v-6h6v6"/></svg><span>Clients</span></a>
      <p class="nav-h">Measure</p>
      <a href="#success" data-route="success"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 12l5-5"/></svg><span>Success measure</span></a>
      <a href="#backtest" data-route="backtest"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg><span>Backtest</span></a>
    </nav>
    <div class="side-foot">
      <div class="who"><span class="avatar">L1</span><div><b>Support agent</b><small>Advice only, P1 never blocked</small></div></div>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <span class="chip chip-strong" id="topTitle">Overview</span>
      <span class="chip" id="asOf">Loading data</span>
      <span class="chip" id="tickets"></span>
      <span class="grow"></span>
      <a class="chip" href="/docs" target="_blank" rel="noopener">API docs</a>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div id="scrim" class="scrim"></div>
<aside id="drawer" class="drawer" aria-hidden="true" aria-label="Ticket detail"></aside>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
